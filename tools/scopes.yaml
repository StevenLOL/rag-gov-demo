# tools/scopes.yaml — declarative least-privilege whitelist per tool
# (data source for the privilege-escalation tests)
#
# The format follows the permission-config style of opencode / claude code
# (allow/ask/deny + pattern matching), ported to the enterprise RAG scenario
# with audit and data classification added.
#
# Field conventions:
#   scope: list of permission scopes, {resource}:{action}; validated on every tool call
#   risk:  low  -> the agent may execute directly; audited afterwards
#          high -> must be approved by a human via LangGraph interrupt() before execution
#   data_class: upper bound of data classification (aligned with the four-level
#          classification in data/corpus/gov_ai_usage_rules.md)

tools:
  search_docs:
    scope: [docs:read]
    risk: low
    data_class: internal
    description: Search the local corpus for sourced passages

  export_report:
    scope: [docs:read, export:write]
    risk: high
    data_class: internal
    description: Export Q&A results to a report file (outbound action, requires human approval)

  delete_record:
    scope: [db:delete]
    risk: high
    data_class: sensitive
    description: Delete audit or session records (destructive action, requires approval + audit)

  call_cloud_llm:
    scope: [llm:external]
    risk: high
    data_class: public
    description: Send content to a public-cloud LLM API (controlled experiments only; sensitive content must be refused)

  # ---- v3b additions: game art assets (bringing the "extract images" action under governance) ----
  # Three gates: permission gate (this file) + authorization gate (asset_policy.yaml) + risk gate (risk),
  # see the header of ragdemo/policy.py for details.
  list_asset_packages:
    scope: [asset:read]
    risk: low
    data_class: internal
    description: List registered asset packages and their licensed uses (read-only metadata)

  scan_asset_package:
    scope: [asset:read]
    risk: low
    data_class: internal
    description: Read-only scan of a game-asset package (totals / category distribution / sampled paths); writes nothing

  extract_game_assets:
    scope: [asset:read, export:write]
    risk: high
    data_class: internal
    description: "Bulk-export assets to disk (real write side effects: must pass the authorization gate, then human approval)"
